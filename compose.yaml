services:
  deepseek-updates-watcher:
    build:
      context: .
    image: deepseek-updates-watcher:local
    container_name: deepseek-updates-watcher
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      STATE_FILE: /data/state.json
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-300}
    volumes:
      - /mnt/c/srv/appdata/deepseek-updates-watcher:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
